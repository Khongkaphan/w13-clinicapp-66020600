# Deploy the React/Vite front-end in /web to Azure App Service
name: Build and deploy Vite app to Azure Web App - app-clinicapp-web-66020600

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/main_app-clinicapp-web-66020600.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Vite front-end
        working-directory: web
        run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BCC382AD9D8A4E0AA507370CE972E223 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FF978F0635624828B0CF40209F9C4EE3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6B4626095950448C82D8467021CB8F3F }}

      - name: Deploy front-end to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-clinicapp-web-66020600'
          slot-name: 'Production'
          package: web-dist
